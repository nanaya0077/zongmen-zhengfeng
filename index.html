<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>宗门争锋 · 基础版</title>
<style>
  :root{
    --bg:#0a0e12; --panel:#10161c; --line:rgba(120,200,180,.15);
    --text:#d9e6e2; --dim:#7b8f8a; --jade:#5eead4;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1200px 600px at 50% -10%, rgba(94,234,212,.08), transparent 60%), #080b0e;
    color:var(--text);
    font-family:"Noto Serif SC","Source Han Serif SC","Songti SC",SimSun,serif;
    overflow:hidden;
  }
  #app{display:flex;flex-direction:column;height:100vh;padding:10px 14px;gap:8px}

  header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{font-size:18px;letter-spacing:3px;color:#e8f6f1}
  .brand b{color:var(--jade);font-weight:500}
  .stats{display:flex;gap:6px;flex-wrap:wrap;flex:1}
  .chip{display:flex;gap:5px;align-items:center;padding:4px 10px;border:1px solid var(--line);
        border-radius:999px;font-size:12px;background:rgba(12,20,24,.6)}
  .chip span{color:var(--dim);font-size:11px}
  .chip b{font-family:ui-monospace,Consolas,monospace;font-weight:600;color:#d7f5ec}
  .clock{display:flex;align-items:center;gap:6px;font-size:12px}
  .clock .date{color:var(--dim);letter-spacing:1px;min-width:92px;text-align:right}
  .spd{background:rgba(94,234,212,.07);border:1px solid var(--line);color:#bfe9df;
       border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer;font-family:inherit}
  .spd.on{background:rgba(94,234,212,.22);border-color:rgba(94,234,212,.6);color:#eafff9}

  main{flex:1;display:flex;gap:10px;min-height:0}
  #mapWrap{position:relative;flex:0 0 auto;border:1px solid var(--line);border-radius:12px;
           overflow:hidden;background:#0a1014;align-self:flex-start}
  canvas{display:block;image-rendering:pixelated;cursor:crosshair}
  aside{flex:1;display:flex;flex-direction:column;gap:8px;min-width:240px;max-height:100%}
  .card{background:rgba(12,18,23,.9);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  #panel{flex:0 0 auto;max-height:62%;overflow:auto;font-size:12.5px;line-height:1.7}
  #log{flex:1;overflow:auto;font-size:12px;line-height:1.6}
  .log-line{padding-left:7px;border-left:2px solid transparent;color:#8ea6a1}
  .log-line.good{color:#7fe7c8;border-color:rgba(94,234,212,.5)}
  .log-line.bad{color:#f09999;border-color:rgba(248,113,113,.5)}
  .log-line.war{color:#e0b64f;border-color:rgba(224,182,79,.4)}
  .log-line em{font-style:normal;color:#5f7d78;margin-right:6px;font-size:10.5px}

  .btn{background:rgba(94,234,212,.08);border:1px solid rgba(94,234,212,.35);color:#c9f7ec;
       padding:5px 10px;border-radius:7px;cursor:pointer;font-size:12px;font-family:inherit}
  .btn:hover{background:rgba(94,234,212,.16)}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .btn.wide{width:100%;margin-top:6px}
  .hint{font-size:11.5px;color:#63767a;margin-top:6px}

  .row{display:flex;justify-content:space-between;gap:8px}
  .row span{color:var(--dim)}
  .name{font-size:15px;letter-spacing:2px;color:#e6f6f1;margin-bottom:4px}
  .tag{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:999px;
       border:1px solid var(--line);color:#9ec9bf;margin-left:4px}
  .cults{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .cult{font-size:11px;padding:2px 6px;border-radius:5px;background:rgba(94,234,212,.08);
        border:1px solid rgba(94,234,212,.2);cursor:pointer}
  .cult.sel{background:rgba(94,234,212,.28);border-color:var(--jade)}

  #overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
           background:rgba(4,7,10,.86);z-index:50;padding:20px;backdrop-filter:blur(4px)}
  #overlay.show{display:flex}
  .modal{background:#0e151b;border:1px solid rgba(94,234,212,.25);border-radius:14px;
         max-width:860px;width:100%;max-height:86vh;overflow:auto;padding:20px 22px}
  .modal h2{margin:0 0 4px;font-size:19px;letter-spacing:3px;color:#e8f6f1}
  .modal p.sub{margin:0 0 14px;color:#7f9793;font-size:12px}
  .cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
  .cand{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:12px;
        cursor:pointer;background:rgba(255,255,255,.015)}
  .cand.on{border-color:var(--jade);background:rgba(94,234,212,.12)}
  .cand .cn{font-size:13.5px;color:#e6f6f1;letter-spacing:1px}
  .cand .cs{color:#7f9793;font-size:11px;margin-top:2px}
  .cand .cu{color:#9ec9bf;font-size:11px;margin-top:4px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">青云宗 <b id="lv">Lv.1</b></div>
    <button class="spd" id="autoBtn" title="自动派遣闲置修士">托管：关</button>
    <div class="stats" id="stats"></div>
    <div class="clock">
      <span class="date" id="date">第 1 年</span>
      <button class="spd" data-spd="0" id="pauseBtn">⏸</button>
      <button class="spd" data-spd="1">1×</button>
      <button class="spd" data-spd="2">2×</button>
      <button class="spd" data-spd="5">5×</button>
      <button class="spd" data-spd="10">10×</button>
    </div>
  </header>

  <main>
    <div id="mapWrap"><canvas id="map" width="900" height="600"></canvas></div>
    <aside>
      <div class="card" id="panel"></div>
      <div class="card" id="log"></div>
    </aside>
  </main>
</div>

<div id="overlay"><div class="modal" id="modal"></div></div>

<script src="js/data.js"></script>
<script src="js/world.js"></script>
<script src="js/ai.js"></script>
<script src="js/sim.js"></script>
<script src="js/game.js"></script>
</body>
</html>
